{{define "site-header"}}
<nav class="site-nav sticky-top" aria-label="Primary">
  <div class="container inner">
    <a class="site-brand" href="/" aria-label="Página inicial">Guilherme Portella</a>

    {{if .Navigation}}
    <ul class="site-links" role="list">
      {{range .Navigation}}
      <li>
        <a href="{{.URL}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Label}}</a>
      </li>
      {{end}}
    </ul>
    {{end}}

    <div class="theme-switch" role="group" aria-label="Tema do site" data-theme-switch hidden>
      <button class="theme-switch__option" type="button" data-theme-option="light" aria-pressed="false">
        <span class="theme-switch__swatch theme-switch__swatch--light" aria-hidden="true"></span>
        <span class="theme-switch__label">Claro</span>
      </button>
      <button class="theme-switch__option" type="button" data-theme-option="gta" aria-pressed="true">
        <span class="theme-switch__swatch theme-switch__swatch--gta" aria-hidden="true"></span>
        <span class="theme-switch__label">Vice City</span>
      </button>
      <button class="theme-switch__option" type="button" data-theme-option="dark" aria-pressed="false">
        <span class="theme-switch__swatch theme-switch__swatch--dark" aria-hidden="true"></span>
        <span class="theme-switch__label">Escuro</span>
      </button>
    </div>
  </div>
</nav>
{{end}}
